<circle cx="1035" cy="37" r="13" fill="#ddf4ff"/>
<text x="1035" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0969da">6</text>
<text x="1100" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1f2328">Review</text>
<text x="1100" y="106" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="14" fill="#0550ae">requesting-</text>
<text x="1100" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace" font-size="14" fill="#0550ae">code-review</text>
<text x="1100" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14.5" fill="#59636e">then respond</text>
<path d="M700,172 C700,228 500,228 500,176" fill="none" stroke="#9a6700" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#l)"/>
<text x="600" y="244" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15" fill="#59636e">failing test: regression test, then back to red-green</text>
<text x="600" y="288" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15" fill="#59636e">Each stage is a SKILL.md that Copilot agent mode reads with read_file when the task calls for it.</text>
