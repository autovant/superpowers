<text x="100" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#1f2328">Brainstorm</text>
