<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">Superpowers workflow</title>
<desc id="d">An illustrative path through six skills: brainstorming, writing-plans, test-driven-development, systematic-debugging, verification-before-completion, requesting-code-review. A dashed arrow loops from systematic-debugging back to test-driven-development.</desc>
