<text x="600" y="288" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15" fill="#9198a1">Each stage is a SKILL.md that Copilot agent mode reads with read_file when the task calls for it.</text>
