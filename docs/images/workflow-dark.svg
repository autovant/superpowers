<text x="1100" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14.5" fill="#9198a1">then respond</text>
<path d="M700,172 C700,228 500,228 500,176" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#l)"/>
