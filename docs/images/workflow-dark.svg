<text x="1035" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4493f8">6</text>
<text x="1100" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#e6edf3">Review</text>
